<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='js/main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <div class="box">
      <h1>Welcome to Age Sort</h1>
      <p>
      Insert your Name, Birth Year, and your Class and we will sort by the age you turn in 2026!
      </p>
    </div>
    
    <div class="box2">
      <h2>My Information</h2>

      <form id="user_form">
        <fieldset>
          <legend>User Information</legend>
          <p>
            <label for="name">Name *:</label>
            <input type="text" id="user_name" name="user_name" required/>
          </p>
          <p>
            <label for="birth_year">Birth Year *:</label>
            <input type="number" id="birth_year" name="birth_year" min="0" max="2026" required/>
          </p>
          <p>
            <label for="user_class">
              <span>Class:</span>
            </label>
            <select id="user_class" name="user_class">
              <option value="Freshman">Freshman</option>
              <option value="Sophomore">Sophomore</option>
              <option value="Junior">Junior</option>
              <option value="Senior">Senior</option>
            </select>
          </p>
          <p class="button">
            <button class="btn btn-primary" type="submit">Submit!</button>
          </p>
        </fieldset>
      </form>
    </div>
    



    <div class="box2">
      <h2>User Information</h2>

      <table id="age_table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Birth Year</th>
            <th>Age</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="age_table_body">
        </tbody>
      </table>

    </div>

    <div class="sort_button">
      <p class="button">
        <button class="btn btn-primary" type="button" id="young_button" >Sort Youngest -> Oldest</button>
      </p>
      <p class="button">
        <button class="btn btn-primary" type="button" id="old_button">Sort Oldest -> Youngest</button>
      </p>
    </div>

  </body>
</html>
