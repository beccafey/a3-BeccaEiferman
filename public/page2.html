<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset='utf-8' />
    <script src='js/main.js' defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <div class="container text-center mt-4">
      <div class="box p-4">
        <h1>Welcome to Age Sort</h1>
          <p>
          Insert you and your friends' Name, Birth Year, and your Class and we will sort by the age you all turn in 2026!
          </p>
      </div>
    </div>
    
    <div class="container mt-4">
      <div class="box2 p-4">
        <h2>My Information</h2>

        <form id="user_form">
          <fieldset>
            <legend>Insert New User Information</legend>
            <div class="mb-3">
              <label for="name" class="form-label">Name *:</label>
              <input type="text" id="user_name" name="user_name" class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="birth_year" class="form-label">Birth Year *:</label>
              <input type="number" id="birth_year" name="birth_year" min="0" max="2026" class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="user_class" class="form-label">
                <span>Class:</span>
              </label>
              <select id="user_class" name="user_class" class="form-select">
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
              </select>
            </div>
            <p class="button">
              <button type="submit" class="btn btn-primary btn-purple">Submit!</button>
            </p>
          </fieldset>
        </form>
      </div>
    
    </div>
    
    


    <div class="container mt-4">
      <div class="box2 p-4">
            <h2>My User Information</h2>
            <div class="table-responsive">
              <table id="age_table" class="table table-bordered table-hover">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Birth Year</th>
                    <th>Age</th>
                    <th>Delete</th>
                    <th>Edit</th>
                  </tr>
                </thead>
                <tbody id="age_table_body">
                </tbody>
              </table>
            </div>
          </div>

          <div class="d-flex justify-content-center align-items-center gap-3">
              <button type="button" id="young_button" class="btn btn-purple">Sort Youngest -> Oldest</button>
              <button type="button" id="old_button" class="btn btn-purple">Sort Oldest -> Youngest</button>
          </div>
    </div>
    

    <div class="form-popup" id="edit_form_div">
      <form id="edit_form" class="form-container">
          <fieldset>
            <legend>Insert New Information</legend>
            <div class="mb-3">
              <label for="name" class="form-label">Name *:</label>
              <input type="text" id="edit_name" name="edit_name" class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="birth_year" class="form-label">Birth Year *:</label>
              <input type="number" id="edit_year" name="edit_year" min="0" max="2026" class="form-control" required/>
            </div>
            <div class="mb-3">
              <label for="user_class" class="form-label">
                <span>Class:</span>
              </label>
              <select id="edit_class" name="edit_class" class="form-select">
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
              </select>
            </div>
            <p class="button">
              <button type="submit" class="btn btn-primary btn-purple" id="save_update">Update</button>
            </p>
            <button type="button" class="btn btn-primary btn-purple cancel" onclick="closeForm()">Close</button>
          </fieldset>
        </form>
    </div>

  </body>
</html>
